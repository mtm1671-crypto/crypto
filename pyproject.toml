[project]
name = "neuromancy"
version = "0.1.0"
description = "Self-improving AI agent desktop app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "aiosqlite>=0.20.0",
    "trafilatura>=1.6.0",
    "psutil>=6.0.0",
    "pyperclip>=1.9.0",
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "plyer>=2.1.0",
    "feedparser>=6.0.0",
    "yt-dlp>=2024.0",
    "PyMuPDF>=1.24.0",
    "asyncpg>=0.29.0",
    "aiosmtplib>=3.0.0",
    "aioimaplib>=1.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
